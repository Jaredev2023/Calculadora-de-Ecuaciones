<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ecuaciones</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            min-height:100vh;

            background: #20199e;
            background: linear-gradient(
                90deg,
                rgba(32, 25, 158, 1) 18%,
                rgba(9, 9, 121, 1) 38%,
                rgba(6, 12, 13, 1) 89%
            );

            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .container{
            width:90%;
            max-width:800px;
            padding:40px;
            border-radius:20px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(8px);

            box-shadow:0px 0px 25px rgba(0,0,0,0.4);

            text-align:center;
        }

        .titulo-box{
            background: rgba(255,255,255,0.12);
            padding:25px;
            border-radius:20px;
            margin-bottom:30px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.4);
        }

        /* ===== GRADIENTE DE TEXTO ===== */

        .text-gradient{

            --_space: ;

            background-image: linear-gradient(
                45deg var(--_space),
                #c11ceb,
                #36c7d1 50%,
                #25007a 100%
            );

            background-clip:text;
            color:transparent;

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        @supports (background-image: linear-gradient(in oklch, #000, #fff)) {
            .text-gradient{
                --_space: in oklch;
            }
        }

        h1{
            font-size:50px;
            margin:0;
        }

        .descripcion{
            margin-top:20px;
            font-size:18px;

            background: rgba(255,255,255,0.08);
            padding:15px;
            border-radius:15px;
        }

        .menu{
            margin-top:35px;

            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        /* ===== BOTONES ===== */

        button{
            background-image: linear-gradient(
                to right,
                #FF512F 0%,
                #F09819 51%,
                #FF512F 100%
            );

            padding:15px 45px;

            text-align:center;
            text-transform:uppercase;

            transition:0.5s;

            background-size:200% auto;

            color:white;

            box-shadow:0 0 20px rgba(0,0,0,0.4);

            border-radius:10px;

            border:none;

            cursor:pointer;

            font-size:16px;
        }

        button:hover{
            background-position:right center;
            transform:scale(1.05);
        }

        a{
            text-decoration:none;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- ===== TITULO ===== -->

        <div class="titulo-box">

            <h1 class="text-gradient">
                Calculadora de Ecuaciones
            </h1>

             <h2 class="text-gradient">
                Desarrollado por Yordi Jared Molina Pacheco
            </h2>

        </div>

        <!-- ===== DESCRIPCION ===== -->

        <div class="descripcion">

            Selecciona una opción del menú para acceder a las diferentes
            operaciones matemáticas disponibles.

        </div>

        <!-- ===== MENU ===== -->

        <div class="menu">

            <!-- ===== OPCION 1 ===== -->
            <!-- CAMBIA opcion1.html POR TU PAGINA -->

            <a href="opcion1.html">
                <button>Ecuacion de  Primer Grado</button>
            </a>

            <!-- ===== OPCION 2 ===== -->
            <!-- CAMBIA opcion2.html POR TU PAGINA -->

            <a href="opcion2.html">
                <button>Ecuacion de Segundo Grado</button>
            </a>

            <!-- ===== OPCION 3 ===== -->
            <!-- CAMBIA opcion3.html POR TU PAGINA -->

            <a href="opcion3.html">
                <button>Sistemas de Ecuacion 2X2</button>
            </a>

            <!-- ===== OPCION 4 ===== -->
            <!-- CAMBIA opcion4.html POR TU PAGINA -->

            <a href="opcion4.html">
                <button>Sistema de Ecuacion 3X3</button>
            </a>

        </div>

    </div>

</body>
</html>
