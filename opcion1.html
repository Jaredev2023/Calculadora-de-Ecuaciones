<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opción 1 - Ecuaciones de Primer Grado</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

    margin:0;
    padding:0;

    font-family:Arial, sans-serif;

    background: linear-gradient(
        90deg,
        rgba(32,25,158,1) 18%,
        rgba(9,9,121,1) 38%,
        rgba(6,12,13,1) 89%
    );

    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:90%;
    max-width:1000px;

    background:rgba(255,255,255,0.08);

    padding:30px;

    border-radius:20px;

    box-shadow:0px 0px 20px rgba(0,0,0,0.4);
}

h1{

    text-align:center;

    font-size:45px;

    background: linear-gradient(
        45deg,
        #c11ceb,
        #36c7d1,
        #25007a
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.descripcion{

    background:rgba(255,255,255,0.08);

    padding:20px;

    border-radius:15px;

    margin-top:20px;

    line-height:1.8;

    font-size:18px;
}

.selector{

    text-align:center;

    margin-top:25px;
}

select{

    padding:12px;

    border:none;

    border-radius:10px;

    font-size:16px;
}

.inputs{

    text-align:center;

    margin-top:30px;
}

input{

    padding:12px;

    margin:8px;

    border:none;

    border-radius:10px;

    width:90px;

    font-size:16px;
}

button{

    background-image: linear-gradient(
        to right,
        #FF512F 0%,
        #F09819 51%,
        #FF512F 100%
    );

    margin:10px;

    padding:15px 35px;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    background-size:200% auto;

    transition:0.5s;
}

button:hover{

    background-position:right center;

    transform:scale(1.05);
}

.resultado{

    margin-top:25px;

    background:rgba(255,255,255,0.08);

    padding:20px;

    border-radius:15px;

    text-align:center;

    font-size:22px;
}

.grafica{

    text-align:center;

    margin-top:30px;

    font-size:24px;

    font-weight:bold;
}

canvas{

    background:white;

    margin-top:20px;

    border-radius:15px;

    padding:10px;
}

.volver{

    text-align:center;

    margin-top:30px;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        Ecuaciones de Primer Grado
    </h1>

    <div class="descripcion">

        Las ecuaciones de primer grado representan rectas.

        <br><br>

        Esta calculadora permite resolver:

        <br><br>

        • Pendiente - Intercepto → y = mx + b

        <br>

        • Forma General → Ax + By + C = 0

        <br><br>

        Además, genera una gráfica de la recta obtenida.

    </div>

    <!-- SELECTOR -->

    <div class="selector">

        <select id="tipo" onchange="mostrarCampos()">

            <option value="pendiente">
                Pendiente - Intercepto
            </option>

            <option value="general">
                Forma General
            </option>

        </select>

    </div>

    <!-- INPUTS -->

    <div class="inputs" id="inputs">

        <!-- Se generan dinámicamente -->

    </div>

    <!-- BOTONES -->

    <div style="text-align:center;">

        <button onclick="resolver()">
            Resolver
        </button>

        <button onclick="limpiar()">
            Limpiar
        </button>

    </div>

    <!-- RESULTADO -->

    <div id="resultado" class="resultado">

        Aquí aparecerá el resultado

    </div>

    <!-- GRAFICA -->

    <div class="grafica">

        Gráfica

    </div>

    <canvas id="grafica"></canvas>

    <!-- VOLVER -->

    <div class="volver">

        <a href="index.html">

            <button>
                Volver al Menú
            </button>

        </a>

    </div>

</div>

<script>

let chart;

/* ===== MOSTRAR INPUTS ===== */

function mostrarCampos(){

    let tipo =
    document.getElementById("tipo").value;

    let contenedor =
    document.getElementById("inputs");

    if(tipo == "pendiente"){

        contenedor.innerHTML = `

            <input type="number" id="m" placeholder="m">

            <input type="number" id="b" placeholder="b">

        `;

    }else{

        contenedor.innerHTML = `

            <input type="number" id="A" placeholder="A">

            <input type="number" id="B" placeholder="B">

            <input type="number" id="C" placeholder="C">

        `;
    }
}

mostrarCampos();

/* ===== RESOLVER ===== */

function resolver(){

    let tipo =
    document.getElementById("tipo").value;

    let xValores = [];
    let yValores = [];

    for(let x=-10; x<=10; x++){

        xValores.push(x);
    }

    if(tipo == "pendiente"){

        let m =
        parseFloat(document.getElementById("m").value);

        let b =
        parseFloat(document.getElementById("b").value);

        if(isNaN(m) || isNaN(b)){

            alert("Completa los campos");

            return;
        }

        xValores.forEach(x => {

            yValores.push((m*x)+b);

        });

        let raiz = (-b/m).toFixed(2);

        document.getElementById("resultado").innerHTML = `

            Ecuación:

            <br><br>

            y = ${m}x + ${b}

            <br><br>

            Intersección con X:

            <br><br>

            x = ${raiz}

        `;

    }else{

        let A =
        parseFloat(document.getElementById("A").value);

        let B =
        parseFloat(document.getElementById("B").value);

        let C =
        parseFloat(document.getElementById("C").value);

        if(isNaN(A) || isNaN(B) || isNaN(C)){

            alert("Completa los campos");

            return;
        }

        xValores.forEach(x => {

            yValores.push((-A*x - C)/B);

        });

        let raiz = (-C/A).toFixed(2);

        document.getElementById("resultado").innerHTML = `

            Ecuación:

            <br><br>

            ${A}x + ${B}y + ${C} = 0

            <br><br>

            Intersección con X:

            <br><br>

            x = ${raiz}

        `;
    }

    crearGrafica(xValores,yValores);
}

/* ===== GRAFICA ===== */

function crearGrafica(x,y){

    const ctx =
    document.getElementById("grafica")
    .getContext("2d");

    if(chart){

        chart.destroy();
    }

    chart = new Chart(ctx, {

        type:'line',

        data:{

            labels:x,

            datasets:[{

                label:'Recta',

                data:y,

                borderWidth:3,

                fill:false,

                tension:0
            }]
        },

        options:{

            responsive:true,

            plugins:{

                title:{

                    display:true,

                    text:'Gráfica de la Recta'
                }
            }
        }
    });
}

/* ===== LIMPIAR ===== */

function limpiar(){

    mostrarCampos();

    document.getElementById("resultado").innerHTML =
    "Aquí aparecerá el resultado";

    if(chart){

        chart.destroy();
    }
}

</script>

</body>
</html>
