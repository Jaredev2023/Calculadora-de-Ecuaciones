<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opción 4 - Sistema 3x3</title>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PYTHON -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

<style>

body{

    margin:0;
    padding:0;

    font-family:Arial, sans-serif;

    background: linear-gradient(
        90deg,
        rgba(32,25,158,1) 18%,
        rgba(9,9,121,1) 38%,
        rgba(6,12,13,1) 89%
    );

    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:90%;
    max-width:1000px;

    background:rgba(255,255,255,0.08);

    padding:30px;

    border-radius:20px;

    box-shadow:0px 0px 20px rgba(0,0,0,0.4);
}

h1{

    text-align:center;

    font-size:45px;

    background: linear-gradient(
        45deg,
        #c11ceb,
        #36c7d1,
        #25007a
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.descripcion{

    background:rgba(255,255,255,0.08);

    padding:20px;

    border-radius:15px;

    margin-top:20px;

    line-height:1.7;
}

.inputs{

    text-align:center;

    margin-top:30px;
}

input{

    padding:12px;

    margin:8px;

    border:none;

    border-radius:10px;

    width:80px;

    font-size:16px;
}

button{

    background-image: linear-gradient(
        to right,
        #FF512F 0%,
        #F09819 51%,
        #FF512F 100%
    );

    margin:10px;

    padding:15px 35px;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    background-size:200% auto;

    transition:0.5s;
}

button:hover{

    background-position:right center;

    transform:scale(1.05);
}

.resultado{

    margin-top:25px;

    background:rgba(255,255,255,0.08);

    padding:20px;

    border-radius:15px;

    text-align:center;

    font-size:20px;
}

.grafica-titulo{

    text-align:center;

    margin-top:30px;

    font-size:24px;

    font-weight:bold;
}

canvas{

    background:white;

    margin-top:20px;

    border-radius:15px;

    padding:10px;
}

.volver{

    text-align:center;

    margin-top:30px;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        Sistema de Ecuaciones 3x3
    </h1>

    <div class="descripcion">

        Esta calculadora permite resolver sistemas de ecuaciones
        lineales de 3x3 utilizando Python.

        <br><br>

        Forma general:

        <br><br>

        a₁x + b₁y + c₁z = d₁

        <br>

        a₂x + b₂y + c₂z = d₂

        <br>

        a₃x + b₃y + c₃z = d₃

    </div>

    <!-- INPUTS -->

    <div class="inputs">

        <!-- ECUACION 1 -->

        <div>

            <input type="number" id="a1" placeholder="a1">
            <input type="number" id="b1" placeholder="b1">
            <input type="number" id="c1" placeholder="c1">
            <input type="number" id="d1" placeholder="d1">

        </div>

        <!-- ECUACION 2 -->

        <div>

            <input type="number" id="a2" placeholder="a2">
            <input type="number" id="b2" placeholder="b2">
            <input type="number" id="c2" placeholder="c2">
            <input type="number" id="d2" placeholder="d2">

        </div>

        <!-- ECUACION 3 -->

        <div>

            <input type="number" id="a3" placeholder="a3">
            <input type="number" id="b3" placeholder="b3">
            <input type="number" id="c3" placeholder="c3">
            <input type="number" id="d3" placeholder="d3">

        </div>

        <br>

        <button onclick="resolver()">
            Resolver
        </button>

        <button onclick="limpiar()">
            Limpiar
        </button>

    </div>

    <!-- RESULTADO -->

    <div id="resultado" class="resultado">

        Aquí aparecerá el resultado

    </div>

    <!-- TITULO GRAFICA -->

    <div class="grafica-titulo">

        Gráfica

    </div>

    <!-- GRAFICA -->

    <canvas id="grafica"></canvas>

    <!-- VOLVER -->

    <div class="volver">

        <a href="index.html">

            <button>
                Volver al Menú
            </button>

        </a>

    </div>

</div>

<script>

let pyodide;
let chart;

/* ===== INICIAR PYTHON ===== */

async function iniciarPython(){

    pyodide = await loadPyodide();

    await pyodide.loadPackage("numpy");
}

window.onload = async () => {

    await iniciarPython();

};

/* ===== RESOLVER ===== */

async function resolver(){

    let valores = [];

    document.querySelectorAll("input").forEach(input => {

        valores.push(parseFloat(input.value));

    });

    if(valores.includes(NaN)){

        alert("Completa todos los campos");

        return;
    }

    let [
        a1,b1,c1,d1,
        a2,b2,c2,d2,
        a3,b3,c3,d3
    ] = valores;

    let codigo = `
import numpy as np

A = np.array([
[${a1},${b1},${c1}],
[${a2},${b2},${c2}],
[${a3},${b3},${c3}]
])

B = np.array([
${d1},
${d2},
${d3}
])

sol = np.linalg.solve(A,B)

x = round(sol[0],2)
y = round(sol[1],2)
z = round(sol[2],2)

f"{x},{y},{z}"
`;

    try{

        let resultadoPython =
        await pyodide.runPythonAsync(codigo);

        let datos = resultadoPython.split(",");

        let x = parseFloat(datos[0]);
        let y = parseFloat(datos[1]);
        let z = parseFloat(datos[2]);

        document.getElementById("resultado").innerHTML = `
            Resultado:
            <br><br>
            x = ${x}
            <br>
            y = ${y}
            <br>
            z = ${z}
        `;

        crearGrafica(x,y,z);

    }catch(error){

        document.getElementById("resultado").innerHTML =
        "El sistema no tiene solución única";
    }
}

/* ===== GRAFICA ===== */

function crearGrafica(x,y,z){

    const ctx =
    document.getElementById("grafica")
    .getContext("2d");

    if(chart){

        chart.destroy();
    }

    chart = new Chart(ctx, {

        type:'line',

        data:{

            labels:['X','Y','Z'],

            datasets:[{

                label:'Resultados',

                data:[x,y,z],

                borderWidth:3,

                fill:false,

                tension:0
            }]
        },

        options:{

            responsive:true,

            plugins:{

                title:{

                    display:true,

                    text:'Gráfica de Resultados'
                }
            },

            scales:{

                y:{

                    beginAtZero:true
                }
            }
        }
    });
}

/* ===== LIMPIAR ===== */

function limpiar(){

    document.querySelectorAll("input").forEach(input => {

        input.value = "";

    });

    document.getElementById("resultado").innerHTML =
    "Aquí aparecerá el resultado";

    if(chart){

        chart.destroy();
    }
}

</script>

</body>
</html>
